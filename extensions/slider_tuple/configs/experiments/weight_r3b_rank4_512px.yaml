# 512 px check on a known run: run 3b (rank 4, lr 3e-4, lambda 1, scene
# anchors) trained at 512 px instead of 1024, 750 steps. Previews are the reduced
# in-training sweep (2 held-out prompts x seeds 1000-1001 x m in 0, +-1.5, +-3 =
# 20 images, rendered at 1024 on Turbo); against 3b's 1024 sweeps they line up
# at m = +-3. For an exact comparison, sweep the saved checkpoints with 3b's
# full grid (overnight; command below). Questions: does 512 px screening read
# like 1024 (body change from ~step 500, drift after)? And was 4c-512's speckle
# from lambda 0 (then this run stays clean) or from 512 px?
#
#   .venv/bin/python extensions/slider_tuple/scripts/sweep_from_samples.py output/weight_r3b_rank4_512px --measure body
#   .venv/bin/python extensions/slider_tuple/scripts/compare_sweeps.py --parity \
#       output/sweeps/weight_r3b_rank4/* output/sweeps/weight_r3b_rank4_512px/*
# Full-grid checkpoint sweep (overnight), the same grid as 3b's sweeps:
#   .venv/bin/python extensions/slider_tuple/scripts/slider_sweep.py \
#       --model /home/csprunger/.nvme_cache/diffusion_models/Krea2/BigLoveKreaLife2_int8.safetensors \
#       --lora output/weight_r3b_rank4_512px/weight_r3b_rank4_512px_000000{250,500,750}.safetensors \
#       --prompts datasets/weight_slider_tuples/held_out.jsonl \
#       --multipliers 0,1,2,3 --diagnostic=-1,-2,-3 --measure body --out output/sweeps/weight_r3b_rank4_512px_full
#
#   .venv/bin/python run.py extensions/slider_tuple/configs/experiments/weight_r3b_rank4_512px.yaml
---
job: extension
config:
  name: "weight_r3b_rank4_512px"
  process:
    - type: "slider_tuple_trainer"
      training_folder: "output"
      device: cuda:0
      performance_log_every: 50
      logging:
        log_every: 1
        use_ui_logger: true # per-step losses and slider/* metrics in output/<name>/loss_log.db
      network:
        type: "lora"
        linear: 4 # run 2 / 3a: 16
        linear_alpha: 4
      save:
        dtype: float16
        save_every: 125
        max_step_saves_to_keep: 16
      datasets:
        - slider_tuples: "datasets/weight_slider_tuples/measured/train.jsonl" # EDIT
          guidance_type: "slider_tuple"
          caption_dropout_rate: 0.0
          cache_latents_to_disk: true
          resolution: [512] # 3b: 1024
      slider:
        # Multiplier unit: kappa = the median tuple span (0.114 body-width units
        # here), so m = 1 is one typical edit's full change, and each tuple
        # trains at multipliers proportional to how much its edit changed the
        # body (strong edit +-0.94, typical +-0.5, weak +-0.16). Tuples spanning
        # less than min_span x kappa are dropped (one here).
        level_norm: median_span
        members_per_step: all
        # writes output/<name>/slider_debug/step<N>_<id>.png for the first
        # steps: every member with its multiplier, to check the data by eye
        debug_dump_steps: 2
        # Anchor preservation (F4): with the LoRA at a random strength in
        # [-anchor_max_multiplier, +], predictions on these prompts must stay
        # the LoRA-off predictions. Costs two extra forwards when drawn
        # (anchor_prob 1: +58% s/step in M5). Prompts without people keep the
        # slider from changing scenes; add prompts for what must not change.
        anchor_strength: 1.0
        anchor_prob: 0.5
        anchor_max_multiplier: 1.0
        anchor_prompts:
          - "a mountain lake at sunrise, pine trees, mist over the water"
          - "a busy city street at night, neon signs, rain on the pavement"
          - "a bowl of fruit on a wooden kitchen table, morning light"
          - "an empty living room with a grey sofa and a bookshelf"
          - "a red sports car parked in front of a garage"
          - "a close-up of a tabby cat sleeping on a blanket"
          - "a snowy forest path with tall evergreen trees"
          - "a modern office interior with desks and large windows"
        # Previews on the deployed Turbo model (F7): 8 steps, CFG off, mu
        # 1.15, trainee LoRA as hooks at each prompt's --m. Raw waits on the CPU.
        turbo_preview: "/home/csprunger/.nvme_cache/diffusion_models/Krea2/BigLoveKreaLife2_int8.safetensors" # EDIT
        turbo_preview_offload: true
      train:
        batch_size: 1
        steps: 750 # 3b: 1000
        gradient_accumulation: 1
        train_unet: true
        train_text_encoder: false
        cache_text_embeddings: true
        gradient_checkpointing: true
        noise_scheduler: "flowmatch"
        timestep_type: "linear" # UI default for Krea 2
        optimizer: "adamw8bit"
        lr: 3e-4 # run 2: 1e-4
        dtype: bf16
      model:
        # Raw checkpoint to train on: a folder with one DiT .safetensors in the
        # krea/Krea-2-Raw format (text encoder and VAE load from their defaults)
        name_or_path: "models/BigLoveKreaLife2_raw_AI-Toolkit"
        arch: "krea2"
        dtype: bf16 # required: the float16 default breaks Krea 2 decoding (NOTES.md)
        # convrot8 (= ComfyUI int8_convrot) is required on a 32 GB card and
        # beat qfloat8 on speed, memory and layer error (NOTES.md)
        quantize: true
        qtype: "convrot8"
        quantize_te: true
        qtype_te: "qfloat8"
        low_vram: false
      sample:
        format: "png"
        sampler: "flowmatch"
        sample_every: 125
        width: 1024
        height: 1024
        # one prompt and seed at several strengths, so images differ only by --m;
        # EDIT: use held-out captions (held_out.jsonl) for a fair look
        neg: ""
        seed: 42
        walk_seed: false
        # used only without turbo_preview (Raw sampling)
        guidance_scale: 4
        sample_steps: 25
        # sweep grid (sweep_grid.py): prompt x seed x multiplier
        # sweep grid (sweep_grid.py): prompt x seed x multiplier
        samples:
          - {prompt: "A frontal three-quarter studio fashion photograph captured at eye level against a plain textured beige backdrop. An adult woman in her thirties with warm medium-brown skin and a short, wavy dark-brown textured bob faces the camera, both arms raised overhead with her hands overlapping above her crown and elbows flared outward; she has small line-art tattoos on each inner forearm, a thin gold chain necklace, subtle makeup, and a neutral expression with slightly parted lips, looking directly into the lens. She wears an off-white ribbed scoop-neck longline tank top with wide shoulder straps and matching off-white high-cut bikini briefs. Soft, warm, diffuse studio lighting illuminates her from the front, casting minimal shadow and a clean, smooth finish with shallow depth of field keeping the backdrop softly out of focus.", seed: 1000, network_multiplier: -3.0}
