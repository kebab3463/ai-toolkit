# Run 5 (DRAFT, ON HOLD until the symmetry question is settled; then rebase on
# the winner of 3b / 4b and drop or soften symmetry_*): a women-only weight slider. Run 4 plus
#  - paired anchors: photos of men with their own captions at strengths up to
#    +-3, so men stay unchanged (independent control in couple photos);
#  - loss masks with background 0.5 and head 0.3 instead of 0.2 / 0, so faces
#    and backgrounds, identical across each tuple's members, are actively kept.
# Revisit after run 4's sweep: if the symmetry loss didn't help, base this on
# run 3b instead (drop the symmetry_* keys).
#
# Data:
#   reweighted masks (done, CPU only):
#     .venv/bin/python extensions/slider_tuple/scripts/reweight_masks.py \
#         datasets/weight_slider_tuples/measured/train.jsonl \
#         datasets/weight_slider_tuples/measured_bg05_head03/train.jsonl --background 0.5 --head-weight 0.3
#   men anchors: datasets/men_anchors/, 30-100 photos of men in the same kinds of
#   scenes as the training data, each with a caption without body-size words.
#   Keep ~5 more men captions out of the folder for the sweep (men_held_out.txt).
#
# Sweeps: women (held-out tuples) and men (should not change):
#   ... slider_sweep.py --lora output/weight_r5_women/weight_r5_women*.safetensors \
#       --prompts datasets/weight_slider_tuples/held_out.jsonl --out output/sweeps/weight_r5_women ...
#   ... slider_sweep.py --lora output/weight_r5_women/weight_r5_women*.safetensors \
#       --prompts datasets/men_held_out.txt --out output/sweeps/weight_r5_women_men ...
#   (model and multipliers as in weight_r4_symmetry.yaml)
#
# Run (from the repo root), or register it in the web UI with scripts/ui_jobs.py:
#   .venv/bin/python run.py extensions/slider_tuple/configs/experiments/weight_r5_women.yaml
---
job: extension
config:
  name: "weight_r5_women"
  process:
    - type: "slider_tuple_trainer"
      training_folder: "output"
      device: cuda:0
      performance_log_every: 50
      logging:
        log_every: 1
        use_ui_logger: true # per-step losses and slider/* metrics in output/<name>/loss_log.db
      network:
        type: "lora"
        linear: 4 # run 2 / 3a: 16
        linear_alpha: 4
      save:
        dtype: float16
        save_every: 125
        max_step_saves_to_keep: 16
      datasets:
        - slider_tuples: "datasets/weight_slider_tuples/measured_bg05_head03/train.jsonl" # run 4: measured/ (bg 0.2, head 0)
          guidance_type: "slider_tuple"
          caption_dropout_rate: 0.0
          cache_latents_to_disk: true
          resolution: [1024]
      slider:
        # Multiplier unit: kappa = the median tuple span (0.114 body-width units
        # here), so m = 1 is one typical edit's full change, and each tuple
        # trains at multipliers proportional to how much its edit changed the
        # body (strong edit +-0.94, typical +-0.5, weak +-0.16). Tuples spanning
        # less than min_span x kappa are dropped (one here).
        level_norm: median_span
        members_per_step: all
        # writes output/<name>/slider_debug/step<N>_<id>.png for the first
        # steps: every member with its multiplier, to check the data by eye
        debug_dump_steps: 2
        # Anchors: photos of men with their own captions (paired anchors), so the
        # LoRA leaves men unchanged at any strength up to +-3. Run 4's scene prompts
        # are dropped: they don't cover people or the strengths where drift shows.
        anchor_strength: 1.0
        anchor_prob: 0.5
        anchor_max_multiplier: 3.0
        anchor_images: "datasets/men_anchors" # EDIT: <name>.png + <name>.txt / .json captions
        # Previews on the deployed Turbo model (F7): 8 steps, CFG off, mu
        # 1.15, trainee LoRA as hooks at each prompt's --m. Raw waits on the CPU.
        turbo_preview: "/home/csprunger/.nvme_cache/diffusion_models/Krea2/BigLoveKreaLife2_int8.safetensors" # EDIT
        turbo_preview_offload: true
        # symmetry loss (symmetry.py): the LoRA at +s and -s must average back to
        # the LoRA-off prediction on the training images, s in [0, 3]. Removes
        # the even drift that ended runs 3a / 3b after step 500. Strength 10: the
        # drift is driven by the base model's full prediction error on the
        # training images (the ~0.27 loss scale, times s^2), so a pull-back of 1
        # would balance it only at a large drift. Untested; the sweep decides.
        symmetry_strength: 10.0
        symmetry_max_multiplier: 3.0
        symmetry_prob: 0.5
      train:
        batch_size: 1
        steps: 1000
        gradient_accumulation: 1
        train_unet: true
        train_text_encoder: false
        cache_text_embeddings: true
        gradient_checkpointing: true
        noise_scheduler: "flowmatch"
        timestep_type: "linear" # UI default for Krea 2
        optimizer: "adamw8bit"
        lr: 3e-4 # run 2: 1e-4
        dtype: bf16
      model:
        # Raw checkpoint to train on: a folder with one DiT .safetensors in the
        # krea/Krea-2-Raw format (text encoder and VAE load from their defaults)
        name_or_path: "models/BigLoveKreaLife2_raw_AI-Toolkit"
        arch: "krea2"
        dtype: bf16 # required: the float16 default breaks Krea 2 decoding (NOTES.md)
        # convrot8 (= ComfyUI int8_convrot) is required on a 32 GB card and
        # beat qfloat8 on speed, memory and layer error (NOTES.md)
        quantize: true
        qtype: "convrot8"
        quantize_te: true
        qtype_te: "qfloat8"
        low_vram: false
      sample:
        sampler: "flowmatch"
        sample_every: 125
        width: 1024
        height: 1024
        # one prompt and seed at several strengths, so images differ only by --m;
        # EDIT: use held-out captions (held_out.jsonl) for a fair look
        prompts:
          - "full-body photograph of a woman standing on a city sidewalk in jeans and a t-shirt --m -1"
          - "full-body photograph of a woman standing on a city sidewalk in jeans and a t-shirt --m 0"
          - "full-body photograph of a woman standing on a city sidewalk in jeans and a t-shirt --m 1"
          - "full-body beach photograph of a man in swim shorts at the surf line --m -1"
          - "full-body beach photograph of a man in swim shorts at the surf line --m 0"
          - "full-body beach photograph of a man in swim shorts at the surf line --m 1"
        neg: ""
        seed: 42
        walk_seed: false
        # used only without turbo_preview (Raw sampling)
        guidance_scale: 4
        sample_steps: 25
meta:
  name: "[name]"
  version: "1.0"
