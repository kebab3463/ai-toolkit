# 512 px screen: baseline with timestep_type shift (Krea 2's own schedule:
# exponential time shift interpolated by image tokens) instead of linear
# (uniform). More training at high noise, where body shape is decided; T-LoRA
# warns high noise is also where composition gets memorized. Note the shift
# rises with resolution: ~1.79 at 512 vs ~2.47 at 1024 (the guide's ~2.5), so
# this screen tests a milder version of what a 1024 run would use.
#
# 512 px screening (NOTES.md, "512 px screening"): 3b's learn-then-break arc
# (slider ~step 250, breakdown ~375 at 512) sampled every 62 steps for 496
# steps (8 x 62, so the final sample is the last interval); 20-image in-training sweep (2 held-out prompts x seeds 1000-1001 x m
# in 0, +-1.5, +-3) at 1024 on Turbo; no step-0 previews; no anchors. Compare
# the three screens with each other (same settings), e.g.:
#   for r in weight_s512_base weight_s512_rank2 weight_s512_shift; do
#     .venv/bin/python extensions/slider_tuple/scripts/sweep_from_samples.py output/$r --measure body; done
#   .venv/bin/python extensions/slider_tuple/scripts/compare_sweeps.py --parity \
#       output/sweeps/weight_s512_base/* output/sweeps/weight_s512_rank2/* output/sweeps/weight_s512_shift/*
#
# Run (from the repo root), or from the web UI (registered with scripts/ui_jobs.py):
#   .venv/bin/python run.py extensions/slider_tuple/configs/experiments/weight_s512_shift.yaml
---
job: extension
config:
  name: "weight_s512_shift"
  process:
    - type: "slider_tuple_trainer"
      training_folder: "output"
      device: cuda:0
      performance_log_every: 50
      logging:
        log_every: 1
        use_ui_logger: true # per-step losses and slider/* metrics in output/<name>/loss_log.db
      network:
        type: "lora"
        linear: 4 # run 2 / 3a: 16
        linear_alpha: 4
      save:
        dtype: float16
        save_every: 62
        max_step_saves_to_keep: 16
      datasets:
        - slider_tuples: "datasets/weight_slider_tuples/measured/train.jsonl" # EDIT
          guidance_type: "slider_tuple"
          caption_dropout_rate: 0.0
          cache_latents_to_disk: true
          resolution: [512]
      slider:
        # Multiplier unit: kappa = the median tuple span (0.114 body-width units
        # here), so m = 1 is one typical edit's full change, and each tuple
        # trains at multipliers proportional to how much its edit changed the
        # body (strong edit +-0.94, typical +-0.5, weak +-0.16). Tuples spanning
        # less than min_span x kappa are dropped (one here).
        level_norm: median_span
        members_per_step: all
        # writes output/<name>/slider_debug/step<N>_<id>.png for the first
        # steps: every member with its multiplier, to check the data by eye
        debug_dump_steps: 2
        # no anchors in screening runs
        # Previews on the deployed Turbo model (F7): 8 steps, CFG off, mu
        # 1.15, trainee LoRA as hooks at each prompt's --m. Raw waits on the CPU.
        turbo_preview: "/home/csprunger/.nvme_cache/diffusion_models/Krea2/BigLoveKreaLife2_int8.safetensors" # EDIT
        turbo_preview_offload: true
      train:
        skip_first_sample: true # step-0 previews are the base model
        batch_size: 1
        steps: 496 # 8 x 62: the final sample / save lands on the last interval
        gradient_accumulation: 1
        train_unet: true
        train_text_encoder: false
        cache_text_embeddings: true
        gradient_checkpointing: true
        noise_scheduler: "flowmatch"
        timestep_type: "shift" # baseline: linear
        optimizer: "adamw8bit"
        lr: 3e-4 # run 2: 1e-4
        dtype: bf16
      model:
        # Raw checkpoint to train on: a folder with one DiT .safetensors in the
        # krea/Krea-2-Raw format (text encoder and VAE load from their defaults)
        name_or_path: "models/BigLoveKreaLife2_raw_AI-Toolkit"
        arch: "krea2"
        dtype: bf16 # required: the float16 default breaks Krea 2 decoding (NOTES.md)
        # convrot8 (= ComfyUI int8_convrot) is required on a 32 GB card and
        # beat qfloat8 on speed, memory and layer error (NOTES.md)
        quantize: true
        qtype: "convrot8"
        quantize_te: true
        qtype_te: "qfloat8"
        low_vram: false
      sample:
        format: "png"
        sampler: "flowmatch"
        sample_every: 62
        width: 1024
        height: 1024
        # one prompt and seed at several strengths, so images differ only by --m;
        # EDIT: use held-out captions (held_out.jsonl) for a fair look
        neg: ""
        seed: 42
        walk_seed: false
        # used only without turbo_preview (Raw sampling)
        guidance_scale: 4
        sample_steps: 25
        # sweep grid (sweep_grid.py): prompt x seed x multiplier
        # sweep grid (sweep_grid.py): prompt x seed x multiplier
