# M4 smoke test: the same 5 synthetic pairs as krea2_polarity_smoke.yaml, as
# two-member tuples (levels +1 / -1) trained with guidance_type: slider_tuple.
# Everything else matches the polarity config, so the two runs are comparable.
#
# Manifest (from the polarity folders, in their scan order):
#   .venv/bin/python extensions/slider_tuple/scripts/pairs_to_manifest.py \
#       datasets/slider_smoke/after datasets/slider_smoke/before datasets/slider_smoke/tuples.jsonl
#
# Per-step losses cannot match polarity exactly on the GPU: the Qwen-Image VAE
# samples its latent, and polarity re-encodes its partner every step (consuming
# the RNG before noise/timesteps are drawn) while slider_tuple caches member
# latents. Exact equivalence on fixed inputs is covered by the CPU tests.
#
# Run (from the repo root):
#   SEED=42 .venv/bin/python run.py extensions/slider_tuple/configs/krea2_tuple_smoke.yaml
---
job: extension
config:
  name: "krea2_tuple_smoke"
  process:
    - type: "slider_tuple_trainer"
      training_folder: "output"
      device: cuda:0
      performance_log_every: 10
      # per-step loss to <run folder>/loss_log.db, for comparing M1 and M2
      logging:
        log_every: 1
        use_ui_logger: true
      network:
        type: "lora"
        linear: 16
        linear_alpha: 16
      save:
        dtype: float16
        save_every: 200
        max_step_saves_to_keep: 2
      datasets:
        - slider_tuples: "datasets/slider_smoke/tuples.jsonl"
          guidance_type: "slider_tuple"
          caption_dropout_rate: 0.0
          cache_latents_to_disk: true
          resolution: [1024]
      slider:
        # levels +-1 centered with kappa 1 -> multipliers +-1, like polarity at weight 1
        level_norm: none
        debug_dump_steps: 1 # writes <run>/slider_debug/step000000_<id>.png
      train:
        batch_size: 1
        steps: 200
        gradient_accumulation: 1
        train_unet: true
        train_text_encoder: false
        cache_text_embeddings: true
        gradient_checkpointing: true
        noise_scheduler: "flowmatch"
        timestep_type: "linear" # UI default for Krea 2
        optimizer: "adamw8bit"
        lr: 1e-4
        dtype: bf16
      model:
        # BigLove Krea Life 2 (fine-tune of Krea 2 Raw): a folder holding one
        # bf16 DiT checkpoint in the same format as krea/Krea-2-Raw (identical
        # keys and shapes). The text encoder and VAE still load from their
        # default repos. Use "krea/Krea-2-Raw" for the official base model.
        name_or_path: "models/BigLoveKreaLife2_raw_AI-Toolkit"
        arch: "krea2"
        # also sets the VAE dtype; the float16 default breaks Krea 2 sample
        # decoding (bf16 latents into an fp16 VAE), see NOTES.md
        dtype: bf16
        # 8-bit is required on a 32 GB card: with quantize: false the bf16 DiT
        # saturates VRAM, and low_vram: true makes steps take >5 min (M1).
        # convrot8 (= ComfyUI int8_convrot) beat qfloat8 on the DiT: 18% faster,
        # 3.5 GiB less memory, half the layer error (NOTES.md).
        quantize: true
        qtype: "convrot8"
        quantize_te: true
        qtype_te: "qfloat8"
        low_vram: false
      sample:
        sampler: "flowmatch"
        sample_every: 100
        width: 1024
        height: 1024
        # same prompt and seed at three LoRA strengths; walk_seed off so the
        # three images differ only by multiplier
        prompts:
          - "photo of a person standing in a park, full body --m -1"
          - "photo of a person standing in a park, full body --m 0"
          - "photo of a person standing in a park, full body --m 1"
        neg: ""
        seed: 42
        walk_seed: false
        guidance_scale: 4
        sample_steps: 25
meta:
  name: "[name]"
  version: "1.0"
