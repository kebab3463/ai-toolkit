[project]
name = "ai-toolkit"
version = "0.0.1"
requires-python = ">=3.11,<3.13"
dependencies = [
    "accelerate>=1.14.0",
    "albucore==0.0.16",
    "albumentations==1.4.15",
    "av==16.0.1",
    "bitsandbytes>=0.49.2",
    "controlnet-aux==0.0.10",
    "diffusers",
    "einops>=0.8.2",
    "flatten-json>=0.1.14",
    "gradio>=6.18.0",
    "hf-transfer>=0.1.9",
    "hf-xet>=1.5.1",
    "huggingface-hub==1.10.1",
    "invisible-watermark>=0.2.0",
    "k-diffusion>=0.1.1.post1",
    "kornia>=0.8.3",
    "librosa==0.11.0",
    "lpips>=0.1.4",
    "lycoris-lora==1.8.3",
    "matplotlib==3.10.1",
    "mutagen==1.47.0",
    "omegaconf>=2.3.1",
    "open-clip-torch>=3.3.0",
    "openai>=2.41.1",
    "opencv-python>=4.11.0.86",
    "optimum-quanto==0.2.4",
    "oyaml>=1.0",
    "peft==0.18.1",
    "prodigyopt>=1.1.2",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "python-slugify>=8.0.4",
    "pytorch-fid>=0.3.0",
    "pytorch-wavelets==1.3.0",
    "pyyaml>=6.0.3",
    "safetensors>=0.8.0",
    "sentencepiece>=0.2.1",
    "setuptools==69.5.1",
    "tensorboard>=2.20.0",
    "timm==1.0.22",
    "toml>=0.10.2",
    "torch>=2.12.0",
    "torchao==0.10.0",
    "torchaudio>=2.11.0",
    "torchcodec==0.9.1",
    "torchvision>=0.27.0",
    "transformers==5.5.3",
    "triton>=3.7.0",
    "wheel>=0.47.0",
]

[tool.uv]
no-build-isolation-package = []

[tool.uv.workspace]
members = []

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
triton = [{ index = "pytorch-cuda", marker = "sys_platform == 'linux' and platform_machine != 'aarch64'" },]
torch = [{ index = "pytorch-cuda", marker = "sys_platform == 'linux' and platform_machine != 'aarch64'" },]
torchvision = [{ index = "pytorch-cuda", marker = "sys_platform == 'linux' and platform_machine != 'aarch64'" },]
torchaudio = [{ index = "pytorch-cuda", marker = "sys_platform == 'linux' and platform_machine != 'aarch64'" },]
diffusers = { git = "https://github.com/huggingface/diffusers.git", rev = "dc8d9032171c83741fd37ed2b12bc9d8274464f3" }
